name: F1 ETL Pipeline

on:
  workflow_dispatch:
  
  schedule:
    - cron: '0 0 * * 3'
    - cron: '43 0 * * 4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas requests
      
      - name: Run extraction
        run: python src/01-extract.py
      
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: extracted-data
          path: output/extracted_data.pkl
          if-no-files-found: error
          retention-days: 7

  load:
    runs-on: ubuntu-latest
    needs: extract
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download extracted data
        uses: actions/download-artifact@v4
        with:
          name: extracted-data
          path: output
      
      - name: Build jolpica.db (raw tables only)
        run: python src/02-load.py

      - name: Verify jolpica.db exists
        run: |
          if [ ! -f "dist/jolpica.db" ]; then
            echo "ERROR: jolpica.db was not created!"
            echo "Checking output folder:"
            ls -la dist/ 2>/dev/null || echo "dist/ folder doesn't exist"
            echo "Checking log output:"
            cat src/load.log 2>/dev/null || echo "No log file found"
            exit 1
          fi
          echo "Database exists: $(ls -lh dist/jolpica.db)"
      
      - name: Upload jolpica.db
        uses: actions/upload-artifact@v4
        with:
          name: jolpica-db
          path: dist/jolpica.db
          if-no-files-found: error
          retention-days: 7

      - name: Verify outputs
        run: |
          echo "=== DB folder contents ==="
          ls -la dist/
          echo ""
          echo "=== Table count ==="
          sqlite3 dist/jolpica.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table';"

      - name: Commit jolpica.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          git add -f dist/jolpica.db
          git commit -m "Update jolpica.db [skip ci]" || echo "Nothing to commit"
          git push

  transform:
    runs-on: ubuntu-latest
    needs: load
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dbt dependencies
        run: |
          pip install "dbt-core==1.9.1" "dbt-sqlite==1.9.1" dbt-docs
      
      - name: Download jolpica.db
        uses: actions/download-artifact@v4
        with:
          name: jolpica-db
          path: dist
      
      - name: Build formula1.db (transform)
        working-directory: dist
        run: |
          # Delete formula1.db
          rm -f formula1.db
          # Run transform SQL (reads from jolpica.db, writes to formula1.db)
          sqlite3 formula1.db < ../dbt/migrations/transform-tables.sql
      
      - name: Upload formula1.db
        uses: actions/upload-artifact@v4
        with:
          name: formula1-db
          path: dist/formula1.db
          retention-days: 7
      
      - name: Verify formula1.db contents
        working-directory: dist
        run: |
          echo "=== Tables in formula1.db ==="
          sqlite3 formula1.db "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          echo ""
          echo "=== Views in formula1.db ==="
          sqlite3 formula1.db "SELECT name FROM sqlite_master WHERE type='view';"
          echo ""
          echo "=== Row counts ==="
          sqlite3 formula1.db "SELECT 'season', COUNT(*) FROM season UNION ALL SELECT 'driver', COUNT(*) FROM driver UNION ALL SELECT 'lap', COUNT(*) FROM lap;"

      - name: Initialize dbt profile
        run: |
          mkdir -p ~/.dbt
          printf '%s\n' \
            'sqlite:' \
            '  target: dev' \
            '  outputs:' \
            '    dev:' \
            '      type: sqlite' \
            '      threads: 1' \
            "      database: 'database'" \
            "      schema: 'main'" \
            '      schemas_and_paths:' \
            "        main: ${GITHUB_WORKSPACE}/dist/formula1.db" \
            "      schema_directory: ${GITHUB_WORKSPACE}/dist" \
            > ~/.dbt/profiles.yml
      
      - name: Run dbt debug
        working-directory: dbt
        run: dbt debug
      
      - name: Run dbt models
        working-directory: dbt
        run: dbt run
      
      - name: Run dbt tests
        working-directory: dbt
        run: dbt test
      
      - name: Generate dbt documentation
        working-directory: dbt
        run: dbt docs generate
      
      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target/
          retention-days: 30
      
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: "data-latest"
          artifacts: "dist/formula1.db"
          allowUpdates: true
          makeLatest: true
          generateReleaseNotes: false
          body: "Automated database update from F1 ETL pipeline"

  deploy_docs:
    runs-on: ubuntu-latest
    needs: transform
    if: always()
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download dbt docs artifact
        uses: actions/download-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish_databricks:
    name: Publish to Databricks
    needs: [transform]
    runs-on: ubuntu-latest
    # Publish should now be required for success
    continue-on-error: false
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download jolpica.db
        uses: actions/download-artifact@v4
        with:
          name: jolpica-db
          path: dist/

      - name: Install dependencies
        run: pip install "databricks-sql-connector>=3.0" pandas pyarrow requests

      - name: Publish jolpica.db to Databricks
        timeout-minutes: 30
        env:
          SQLITE_PATH: dist/jolpica.db
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG }}
          JOLPICA_SCHEMA: jolpica
        run: python src/04-publish-databricks.py
  
