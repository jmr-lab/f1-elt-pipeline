name: F1 ETL Pipeline

on:
  workflow_dispatch:
  
  schedule:
    - cron: '0 0 * * 3'
    - cron: '43 0 * * 4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  extract:
    name: Extract (Jolpica API → CSV)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas requests
      
      - name: Run extraction
        run: python src/01-extract.py
      
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: extracted-data
          path: output/*.csv
          if-no-files-found: error
          retention-days: 7

  load:
    name: Load (CSV → Raw DB v1)
    runs-on: ubuntu-latest
    needs: extract
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download extracted data
        uses: actions/download-artifact@v4
        with:
          name: extracted-data
          path: output
      
      - name: Build database
        run: python src/02-load.py
      
      - name: Verify database structure
        run: |
          echo "=== Raw v1 tables created ==="
          sqlite3 dist/formula1.db "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'v2_%' ORDER BY name;"
      
      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: f1-database
          path: dist/formula1.db
          retention-days: 7

  transform:
    name: Transform (v1 → v2 + dbt models)
    runs-on: ubuntu-latest
    needs: load
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dbt dependencies
        run: |
          pip install "dbt-core==1.9.1" "dbt-sqlite==1.9.1" dbt-docs
      
      - name: Download database artifact
        uses: actions/download-artifact@v4
        with:
          name: f1-database
          path: dist
      
      - name: Run v1→v2 schema transformation
        run: |
          sqlite3 dist/formula1.db < dbt/migrations/transform-tables.sql
      
      - name: Verify v2 tables exist
        run: |
          echo "Old v1 tables:"
          sqlite3 dist/formula1.db "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'v2_%' ORDER BY name;"
          echo ""
          echo "New v2_ tables:"
          sqlite3 dist/formula1.db "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'v2_%' ORDER BY name;"
      
      - name: Initialize dbt profile
        run: |
          mkdir -p ~/.dbt
          printf '%s\n' \
            'sqlite:' \
            '  target: dev' \
            '  outputs:' \
            '    dev:' \
            '      type: sqlite' \
            '      threads: 1' \
            "      database: 'database'" \
            "      schema: 'main'" \
            '      schemas_and_paths:' \
            "        main: ${GITHUB_WORKSPACE}/dist/formula1.db" \
            "      schema_directory: ${GITHUB_WORKSPACE}/dist" \
            > ~/.dbt/profiles.yml
      
      - name: Run dbt debug
        working-directory: dbt
        run: dbt debug
      
      - name: Run dbt models
        working-directory: dbt
        run: dbt run
      
      - name: Run dbt tests
        working-directory: dbt
        run: dbt test
      
      - name: Verify views and data
        run: |
          echo "=== f1summary view sample ==="
          sqlite3 dist/formula1.db "SELECT COUNT(*) as total FROM f1summary;"
      
      - name: Upload transformed database
        uses: actions/upload-artifact@v4
        with:
          name: f1-database-transformed
          path: dist/formula1.db
          retention-days: 30

  publish:
    name: Publish (docs + release)
    runs-on: ubuntu-latest
    needs: transform
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dbt dependencies
        run: pip install "dbt-core==1.9.1" "dbt-sqlite==1.9.1" dbt-docs
      
      - name: Download transformed database
        uses: actions/download-artifact@v4
        with:
          name: f1-database-transformed
          path: dist
      
      - name: Initialize dbt profile
        run: |
          mkdir -p ~/.dbt
          printf '%s\n' \
            'sqlite:' \
            '  target: dev' \
            '  outputs:' \
            '    dev:' \
            '      type: sqlite' \
            '      threads: 1' \
            "      database: 'database'" \
            "      schema: 'main'" \
            '      schemas_and_paths:' \
            "        main: ${GITHUB_WORKSPACE}/dist/formula1.db" \
            "      schema_directory: ${GITHUB_WORKSPACE}/dist" \
            > ~/.dbt/profiles.yml
      
      - name: Generate dbt documentation
        working-directory: dbt
        run: dbt docs generate
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Download transformed database
        uses: actions/download-artifact@v4
        with:
          name: f1-database-transformed
          path: dist
      
      - name: Commit and push database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          git pull --rebase origin main || true
          
          if [ -f dist/formula1.db ]; then
            git add dist/formula1.db
          fi
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git status --short
            git commit -m "[data-update] Refresh F1 database [skip ci]"
          fi
          
          git push
      
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: "data-latest"
          artifacts: "dist/formula1.db"
          allowUpdates: true
          makeLatest: true
          generateReleaseNotes: false
          body: "Automated database update from F1 ETL pipeline"
