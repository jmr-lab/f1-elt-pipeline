name: F1 ETL Pipeline

on:
  workflow_dispatch:
  
  schedule:
    - cron: '0 0 * * 3'
    - cron: '43 0 * * 4'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas requests
      
      - name: Run extraction
        run: python src/01-extract.py
      
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: extracted-data
          path: output/extracted_data.pkl
          if-no-files-found: error
          retention-days: 7

  load:
    runs-on: ubuntu-latest
    needs: extract
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download extracted data
        uses: actions/download-artifact@v4
        with:
          name: extracted-data
          path: output
      
      - name: Build database
        run: python src/02-load.py
      
      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: f1-database
          path: dist/formula1.db
          retention-days: 7
      
      - name: Verify outputs
        run: |
          echo "=== DB folder contents ==="
          ls -la dist/
          
          echo ""
          echo "=== Extract folder contents ==="
          ls -la data/raw/ 2>/dev/null || echo "No data/raw folder"

  transform:
    runs-on: ubuntu-latest
    needs: load
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dbt dependencies
        run: |
          pip install "dbt-core==1.9.1" "dbt-sqlite==1.9.1"
      
      - name: Download database artifact
        uses: actions/download-artifact@v4
        with:
          name: f1-database
          path: dist
      
      - name: Initialize dbt profile
        run: |
          mkdir -p ~/.dbt
          printf '%s\n' \
            'sqlite:' \
            '  target: dev' \
            '  outputs:' \
            '    dev:' \
            '      type: sqlite' \
            '      threads: 1' \
            "      database: 'database'" \
            "      schema: 'main'" \
            '      schemas_and_paths:' \
            "        main: ${GITHUB_WORKSPACE}/dist/formula1.db" \
            "      schema_directory: ${GITHUB_WORKSPACE}/dist" \
            > ~/.dbt/profiles.yml
      
      - name: Run dbt debug
        working-directory: dbt
        run: dbt debug
      
      - name: Run dbt
        working-directory: dbt
        run: dbt run
      
      - name: Verify views created
        run: |
          echo "=== Tables in database ==="
          sqlite3 dist/formula1.db ".tables"
          
          echo ""
          echo "=== f1summary view sample ==="
          sqlite3 dist/formula1.db "SELECT COUNT(*) as total FROM f1summary;"
      
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: "data-latest"
          artifacts: "dist/formula1.db"
          allowUpdates: true
          makeLatest: true
          generateReleaseNotes: false
          body: "Automated database update from F1 ETL pipeline"
