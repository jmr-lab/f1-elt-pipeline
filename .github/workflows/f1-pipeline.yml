name: F1 ETL Pipeline

on:
  workflow_dispatch:
  
  schedule:
    - cron: '0 0 * * 3'
    - cron: '43 0 * * 4'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas requests
      
      - name: Run extraction
        run: python src/01-extract.py
      
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: extracted-data
          path: output/extracted_data.pkl
          if-no-files-found: error
          retention-days: 7

  load:
    runs-on: ubuntu-latest
    needs: extract
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download extracted data
        uses: actions/download-artifact@v4
        with:
          name: extracted-data
          path: output
      
      - name: Build database
        run: python src/02-load.py

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: f1-database
          path: data/db/formula1.db
          retention-days: 7
      
      - name: Verify outputs
        run: |
          echo "=== DB folder contents ==="
          ls -la data/db/
    
          echo ""
          echo "=== Extract folder contents ==="
          ls -la data/raw/ 2>/dev/null || echo "No data/raw folder"
    
      - name: Stage output files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          echo "Files to stage:"
          ls -la data/db/
    
          git add data/db/
    
          echo "Checking for changes..."
          git status --short
    
          if git diff --cached --quiet; then
            echo "No changes to commit (database identical to previous version)"
          else
            git commit -m "[data-update] Refresh F1 database [skip ci]"
          fi
    
      - name: Push changes
        run: git push
      
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: "data-latest"
          artifacts: "sql/formula1.db"
          allowUpdates: true
          makeLatest: true
          generateReleaseNotes: false
          body: "Automated database update from F1 ETL pipeline"

  transform:
    runs-on: ubuntu-latest
    needs: load
  
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dbt dependencies
      run: |
        pip install "dbt-core==1.5.1" "dbt-sqlite==1.5.1"
    
    - name: Download database artifact
      uses: actions/download-artifact@v4
      with:
        name: f1-database
        path: data/db
    
    - name: Initialize dbt profile
      run: |
        mkdir -p ~/.dbt
        cat > ~/.dbt/profiles.yml << EOF
        sqlite:
          target: dev
          outputs:
            dev:
              type: sqlite
              threads: 1
              database: data/db/formula1.db
              schema: main
        EOF
    
    - name: Run dbt debug
      working-directory: dbt
      run: dbt debug
    
    - name: Run dbt
      working-directory: dbt
      run: dbt run
    
    - name: Verify views created
      run: |
        echo "=== Tables in database ==="
        sqlite3 data/db/formula1.db ".tables"
        
        echo ""
        echo "=== f1summary view sample ==="
        sqlite3 data/db/formula1.db "SELECT COUNT(*) as total FROM f1summary;"
    
    - name: Commit updated database
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/db/
        
        echo "Checking for changes..."
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git status
          git commit -m "[data-update] Create F1 views via dbt [skip ci]"
        fi
    
    - name: Push changes
      run: git push
    
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        tag: "data-latest"
        artifacts: "data/db/formula1.db"
        allowUpdates: true
        makeLatest: true
        generateReleaseNotes: false
        body: "Automated database update from F1 ETL pipeline"
