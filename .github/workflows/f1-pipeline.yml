name: F1 ETL Pipeline

on:
  workflow_dispatch:
  
  schedule:
    - cron: '0 0 * * 3'
    - cron: '43 0 * * 4'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas requests
      
      - name: Run extraction
        run: python src/01-extract.py
      
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: extracted-data
          path: output/extracted_data.pkl
          if-no-files-found: error
          retention-days: 7

  build_db:
    runs-on: ubuntu-latest
    needs: extract
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download extracted data
        uses: actions/download-artifact@v4
        with:
          name: extracted-data
          path: output
      
      - name: Build database
        run: python build_f1_db.py
      
      - name: Verify outputs
        run: |
          echo "=== SQL folder contents ==="
          ls -la sql/
          
          echo ""
          echo "=== Data processed folder contents ==="
          ls -la data/processed/ 2>/dev/null || echo "No data/processed folder"
      
      - name: Stage output files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sql/ formula1.db data/processed/ 2>/dev/null || true
          
          echo "Checking for changes..."
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[data-update] Refresh F1 database [skip ci]"
          fi
      
      - name: Push changes
        run: git push
      
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: "data-latest"
          artifacts: "sql/formula1.db"
          allowUpdates: true
          makeLatest: true
          generateReleaseNotes: false
          body: "Automated database update from F1 ETL pipeline"
