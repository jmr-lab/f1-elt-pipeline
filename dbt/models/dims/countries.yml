version: 2

models:
  - name: countries
    description: "Country code to country name mapping, derived from jolpica._countries_lookup"

    columns:
      - name: id
        description: "Primary key (surrogate, from source rowid)"
        tests:
          - unique
          - not_null
      - name: country_code
        description: "ISO country code"
        tests:
          - unique
          - not_null
      - name: country
        description: "Country name"
      - name: iso_alpha3
        description: "ISO alpha-3 code (not present in source, populated as NULL)"
      - name: continent
        description: "Continent (not present in source, populated as NULL)"
