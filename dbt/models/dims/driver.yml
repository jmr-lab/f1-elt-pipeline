version: 2

models:
  - name: driver
    description: "Driver master data, copied from jolpica.driver"

    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: reference
        description: "Driver reference code"
      - name: abbreviation
        description: "Driver abbreviation"
      - name: forename
        description: "First name"
      - name: surname
        description: "Last name"
        tests:
          - not_null
      - name: permanent_car_number
        description: "Permanent race number"
      - name: date_of_birth
        description: "Date of birth"
      - name: birth_country
        description: "Birth country (renamed from nationality)"
      - name: wikipedia
        description: "Wikipedia page URL"
