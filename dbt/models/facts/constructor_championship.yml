version: 2

models:
  - name: constructor_championship
    description: "Constructor championship standings, renamed from jolpica.team_championship with season_id derivation"

    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: season_id
        description: "FK to season (derived from year when NULL in source)"
        tests:
          - not_null
          - relationships:
              to: ref('season')
              field: id
      - name: year
        description: "Season year"
      - name: constructor_id
        description: "FK to constructor (renamed from team_id)"
        tests:
          - not_null
          - relationships:
              to: ref('constructor')
              field: id
      - name: round_id
        description: "FK to round"
        tests:
          - not_null
          - relationships:
              to: ref('round')
              field: id
      - name: position
        description: "Standings position"
      - name: points
        description: "Championship points"
      - name: win_count
        description: "Number of wins"
      - name: highest_finish
        description: "Highest finish"
      - name: is_eligible
        description: "Eligible flag"
      - name: adjustment_type
        description: "Adjustment type"
      - name: session_id
        description: "FK to session"
        tests:
          - relationships:
              to: ref('session')
              field: id
      - name: session_number
        description: "Session number"
      - name: round_number
        description: "Round number"
