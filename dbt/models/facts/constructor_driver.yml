version: 2

models:
  - name: constructor_driver
    description: |
      Constructor-driver assignments per season, renamed from jolpica.team_driver

      ```mermaid[erd="formula1_erd"]```
    config:
      meta:
        erd:
          connections:
            - diagram: formula1_erd
              target: season
            - diagram: formula1_erd
              target: constructor
            - diagram: formula1_erd
              target: driver

    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: season_id
        description: "FK to season"
        tests:
          - not_null
          - relationships:
              to: ref('season')
              field: id
      - name: constructor_id
        description: "FK to constructor (renamed from team_id)"
        tests:
          - not_null
          - relationships:
              to: ref('constructor')
              field: id
      - name: driver_id
        description: "FK to driver"
        tests:
          - not_null
          - relationships:
              to: ref('driver')
              field: id
      - name: role
        description: "Role type"
