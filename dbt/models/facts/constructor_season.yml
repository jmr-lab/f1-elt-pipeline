version: 2

models:
  - name: constructor_season
    description: "Constructor name/nationality per season (temporal tracking), derived from jolpica.team_driver joined to jolpica.team"

    columns:
      - name: id
        description: "Surrogate primary key (generated row number)"
        tests:
          - unique
          - not_null
      - name: constructor_id
        description: "FK to constructor"
        tests:
          - not_null
          - relationships:
              to: ref('constructor')
              field: id
      - name: season_id
        description: "FK to season"
        tests:
          - not_null
          - relationships:
              to: ref('season')
              field: id
      - name: name
        description: "Name used that season"
        tests:
          - not_null
      - name: nationality
        description: "Nationality for that season"
        tests:
          - not_null
      - name: country_code
        description: "ISO country code"
      - name: constructor_base_id
        description: "Team lineage reference"
        tests:
          - relationships:
              to: ref('constructor_base')
              field: id
