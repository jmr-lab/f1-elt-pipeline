version: 2

models:
  - name: pit_stop
    description: "Pit stop events, copied from jolpica.pit_stop"

    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: session_entry_id
        description: "FK to session_entry"
        tests:
          - not_null
          - relationships:
              to: ref('session_entry')
              field: id
      - name: lap_id
        description: "FK to lap"
        tests:
          - relationships:
              to: ref('lap')
              field: id
      - name: number
        description: "Pit stop number"
      - name: duration
        description: "Duration"
      - name: local_timestamp
        description: "Timestamp"
