version: 2

models:
  - name: round
    description: "Race rounds/events, copied from jolpica.round"

    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: season_id
        description: "FK to season"
        tests:
          - not_null
          - relationships:
              to: ref('season')
              field: id
      - name: circuit_id
        description: "FK to circuit"
        tests:
          - not_null
          - relationships:
              to: ref('circuit')
              field: id
      - name: number
        description: "Round number"
      - name: name
        description: "Event name"
        tests:
          - not_null
      - name: date
        description: "Event date"
      - name: is_cancelled
        description: "Cancelled flag"
      - name: wikipedia
        description: "Wikipedia page URL"
