version: 2

models:
  - name: round_entry
    description: Entry list per race, renamed from jolpica.roundentry

    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: round_id
        description: "FK to round"
        tests:
          - not_null
          - relationships:
              to: ref('round')
              field: id
      - name: constructor_driver_id
        description: "FK to constructor_driver (renamed from team_driver_id)"
        tests:
          - not_null
          - relationships:
              to: ref('constructor_driver')
              field: id
      - name: car_number
        description: "Car number"
