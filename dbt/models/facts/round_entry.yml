version: 2

models:
  - name: round_entry
    description: |
      Entry list per race, renamed from jolpica.roundentry

      ```mermaid[erd="formula1_erd"]```
    config:
      meta:
        erd:
          connections:
            - diagram: formula1_erd
              target: round
              source_cardinality: one_or_more
              target_cardinality: one
              label: entered in
            - diagram: formula1_erd
              target: constructor_driver
              source_cardinality: one_or_more
              target_cardinality: one
              label: assigns

    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: round_id
        description: "FK to round"
        tests:
          - not_null
          - relationships:
              to: ref('round')
              field: id
      - name: constructor_driver_id
        description: "FK to constructor_driver (renamed from team_driver_id)"
        tests:
          - not_null
          - relationships:
              to: ref('constructor_driver')
              field: id
      - name: car_number
        description: "Car number"
