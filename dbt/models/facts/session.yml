version: 2

models:
  - name: session
    description: "Race sessions (practice, qualifying, race, sprint), copied from jolpica.session"

    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: round_id
        description: "FK to round"
        tests:
          - not_null
          - relationships:
              to: ref('round')
              field: id
      - name: type
        description: "Session type (R=Race, Q=Qualifying, P=Practice, S=Sprint)"
        tests:
          - not_null
      - name: number
        description: "Session number"
      - name: timestamp
        description: "Session start timestamp"
      - name: timezone
        description: "Timezone"
      - name: scheduled_laps
        description: "Scheduled laps"
      - name: point_system_id
        description: "FK to points_system"
        tests:
          - relationships:
              to: ref('points_system')
              field: id
      - name: is_cancelled
        description: "Cancelled flag"
      - name: has_time_data
        description: "Has timing data flag"
