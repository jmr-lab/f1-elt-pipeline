version: 2

models:
  - name: session_entry
    description: Driver session results, copied from jolpica.session_entry

    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: session_id
        description: "FK to session"
        tests:
          - not_null
          - relationships:
              to: ref('session')
              field: id
      - name: round_entry_id
        description: "FK to round_entry"
        tests:
          - not_null
          - relationships:
              to: ref('round_entry')
              field: id
      - name: grid
        description: "Grid position"
      - name: position
        description: "Finishing position"
      - name: points
        description: "Points awarded"
      - name: laps_completed
        description: "Laps completed"
      - name: fastest_lap_rank
        description: "Fastest lap rank"
      - name: time
        description: "Finish time"
      - name: detail
        description: "Additional details"
      - name: status
        description: "Result status"
      - name: is_classified
        description: "Classified flag"
      - name: is_eligible_for_points
        description: "Points eligible flag"
