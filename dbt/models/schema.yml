version: 2

models:
  - name: f1summary
    description: "Summary of F1 race results by driver"
    columns:
      - name: resultId
        description: "Unique session entry ID"
      - name: driverName
        description: "Driver's full name"
      - name: year
        description: "Season year"
      - name: points
        description: "Points scored in this race"

sources:
  - name: static_resources
    description: "Static lookup tables maintained in the repository"
    tables:
      - name: _countries_lookup
        description: "Maps country codes to full country names"
        columns:
          - name: country_code
            description: "ISO country code (e.g., GB, DE, FR)"
            tests:
              - unique
              - not_null
