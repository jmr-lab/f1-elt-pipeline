# dbt/models/schema.yml
version: 2

sources:
  # Dimension tables
  - name: season
    description: "F1 racing seasons with metadata"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: year
        description: "Season year"
        tests:
          - unique
      - name: api_id
        description: "Jolpika API identifier"
      - name: championship_system_id
        description: "FK to championship_system"
      - name: wikipedia
        description: "Wikipedia page URL"

  - name: circuit
    description: "Circuit/tracks information"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: name
        description: "Circuit name"
      - name: reference
        description: "Circuit reference code"
      - name: locality
        description: "City/locality"
      - name: country
        description: "Country name"
      - name: country_code
        description: "ISO country code"
      - name: latitude
        description: "Latitude coordinate"
      - name: longitude
        description: "Longitude coordinate"
      - name: altitude
        description: "Altitude in meters"
      - name: wikipedia
        description: "Wikipedia page URL"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: driver
    description: "Driver master data"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: reference
        description: "Driver reference code"
      - name: abbreviation
        description: "Driver abbreviation"
      - name: forename
        description: "First name"
      - name: surname
        description: "Last name"
      - name: nationality
        description: "Driver nationality"
      - name: country_code
        description: "ISO country code"
      - name: date_of_birth
        description: "Date of birth"
      - name: permanent_car_number
        description: "Permanent race number"
      - name: wikipedia
        description: "Wikipedia page URL"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: team
    description: "Team/constructor master data"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: name
        description: "Team name"
      - name: reference
        description: "Team reference code"
      - name: nationality
        description: "Team nationality"
      - name: country_code
        description: "ISO country code"
      - name: base_team_id
        description: "FK to base_team"
      - name: primary_color
        description: "Primary team color"
      - name: wikipedia
        description: "Wikipedia page URL"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: base_team
    description: "Base/parent team groupings"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: name
        description: "Base team name"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: points_system
    description: "Points allocation rules"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: name
        description: "Points system name"
      - name: reference
        description: "Reference code"
      - name: partial
        description: "Partial season flag"
      - name: driver_position_points
        description: "Driver position points"
      - name: driver_fastest_lap
        description: "Fastest lap bonus for drivers"
      - name: team_position_points
        description: "Team position points"
      - name: team_fastest_lap
        description: "Fastest lap bonus for teams"
      - name: shared_drive
        description: "Shared drive allowance"
      - name: is_double_points
        description: "Double points flag"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: championship_system
    description: "Championship calculation rules"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: name
        description: "System name"
      - name: reference
        description: "Reference code"
      - name: driver_best_results
        description: "Best results count for drivers"
      - name: team_best_results
        description: "Best results count for teams"
      - name: driver_season_split
        description: "Driver season split"
      - name: team_season_split
        description: "Team season split"
      - name: team_points_per_session
        description: "Team points per session flag"
      - name: eligibility
        description: "Eligibility rules"
      - name: api_id
        description: "Jolpiка API identifier"

  # Fact tables
  - name: round
    description: "Race rounds/events"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: season_id
        description: "FK to season"
      - name: circuit_id
        description: "FK to circuit"
      - name: number
        description: "Round number"
      - name: race_number
        description: "Race sequence number"
      - name: name
        description: "Event name"
      - name: date
        description: "Event date"
      - name: is_cancelled
        description: "Cancelled flag"
      - name: wikipedia
        description: "Wikipedia page URL"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: team_driver
    description: "Team-driver assignments per season"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: season_id
        description: "FK to season"
      - name: team_id
        description: "FK to team"
      - name: driver_id
        description: "FK to driver"
      - name: role
        description: "Role type"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: roundentry
    description: "Entry list per race"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: round_id
        description: "FK to round"
      - name: team_driver_id
        description: "FK to team_driver"
      - name: car_number
        description: "Car number"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: session
    description: "Race sessions (practice, qualifying, race)"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: round_id
        description: "FK to round"
      - name: type
        description: "Session type"
      - name: number
        description: "Session number"
      - name: timestamp
        description: "Session start timestamp"
      - name: timezone
        description: "Timezone"
      - name: scheduled_laps
        description: "Scheduled laps"
      - name: point_system_id
        description: "FK to points_system"
      - name: is_cancelled
        description: "Cancelled flag"
      - name: has_time_data
        description: "Has timing data flag"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: session_entry
    description: "Driver session results"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: session_id
        description: "FK to session"
      - name: round_entry_id
        description: "FK to roundentry"
      - name: grid
        description: "Grid position"
      - name: position
        description: "Finishing position"
      - name: points
        description: "Points awarded"
      - name: laps_completed
        description: "Laps completed"
      - name: fastest_lap_rank
        description: "Fastest lap rank"
      - name: time
        description: "Finish time"
      - name: detail
        description: "Additional details"
      - name: status
        description: "Result status"
      - name: is_classified
        description: "Classified flag"
      - name: is_eligible_for_points
        description: "Points eligible flag"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: driver_championship
    description: "Driver championship standings"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: season_id
        description: "FK to season"
      - name: year
        description: "Year"
      - name: driver_id
        description: "FK to driver"
      - name: round_id
        description: "FK to round"
      - name: position
        description: "Standings position"
      - name: points
        description: "Championship points"
      - name: win_count
        description: "Number of wins"
      - name: highest_finish
        description: "Highest finish"
      - name: is_eligible
        description: "Eligible flag"
      - name: adjustment_type
        description: "Adjustment type"
      - name: session_id
        description: "FK to session"
      - name: session_number
        description: "Session number"
      - name: round_number
        description: "Round number"

  - name: team_championship
    description: "Team championship standings"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: season_id
        description: "FK to season"
      - name: year
        description: "Year"
      - name: team_id
        description: "FK to team"
      - name: round_id
        description: "FK to round"
      - name: position
        description: "Standings position"
      - name: points
        description: "Championship points"
      - name: win_count
        description: "Number of wins"
      - name: highest_finish
        description: "Highest finish"
      - name: is_eligible
        description: "Eligible flag"
      - name: adjustment_type
        description: "Adjustment type"
      - name: session_id
        description: "FK to session"
      - name: session_number
        description: "Session number"
      - name: round_number
        description: "Round number"

  - name: lap
    description: "Per-lap data"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: session_entry_id
        description: "FK to session_entry"
      - name: number
        description: "Lap number"
      - name: position
        description: "Position on lap"
      - name: time
        description: "Lap time"
      - name: average_speed
        description: "Average speed"
      - name: is_entry_fastest_lap
        description: "Fastest lap flag"
      - name: is_deleted
        description: "Deleted flag"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: pit_stop
    description: "Pit stop events"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: session_entry_id
        description: "FK to session_entry"
      - name: lap_id
        description: "FK to lap"
      - name: number
        description: "Pit stop number"
      - name: duration
        description: "Duration"
      - name: local_timestamp
        description: "Timestamp"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: penalty
    description: "Driver penalties"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: earned_id
        description: "Earned ID"
      - name: served_id
        description: "Served ID"
      - name: position
        description: "Penalty position"
      - name: license_points
        description: "License points"
      - name: is_time_served_in_pit
        description: "In-pit flag"
      - name: time
        description: "Penalty time"
      - name: api_id
        description: "Jolpiка API identifier"

  - name: championship_adjustment
    description: "Championship point adjustments"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: adjustment
        description: "Adjustment value"
      - name: api_id
        description: "Jolpiка API identifier"
      - name: driver_id
        description: "FK to driver"
      - name: points
        description: "Points adjustment"
      - name: season_id
        description: "FK to season"
      - name: team_id
        description: "FK to team"

models:
  # View
  - name: f1summary
    description: "Summary of F1 race results by driver with standings context"
    meta:
      owner: "jmr-lab"
      refresh_schedule: "weekly"
    
    columns:
      - name: resultId
        description: "Unique session entry identifier"
        tests:
          - unique
          - not_null
      
      - name: driverName
        description: "Driver's full name"
        tests:
          - not_null
      
      - name: position
        description: "Finishing position in the race"
      
      - name: points
        description: "Race points awarded"
      
      - name: year
        description: "Season year (excludes current year)"
