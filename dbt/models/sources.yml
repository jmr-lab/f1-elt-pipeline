          - name: position
            description: "Standings position"
          - name: points
            description: "Championship points"
          - name: win_count
            description: "Number of wins"
          - name: highest_finish
            description: "Highest finish"
          - name: is_eligible
            description: "Eligible flag"
          - name: adjustment_type
            description: "Adjustment type"
          - name: session_id
            description: "FK to v2_session"
            tests:
              - relationships:
                  to: source('main', 'v2_session')
                  field: id
          - name: session_number
            description: "Session number"
          - name: round_number
            description: "Round number"

      - name: v2_constructor_championship
        description: "Constructor championship standings (renamed from team_championship)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: season_id
            description: "FK to v2_season"
            tests:
