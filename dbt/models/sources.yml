          - name: duration
            description: "Duration"
          - name: local_timestamp
            description: "Timestamp"

      - name: v2_penalty
        description: "Driver penalties (no api_id)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: earned_session_entry_id
            description: "FK to v2_session_entry (where earned)"
          - name: served_session_entry_id
            description: "FK to v2_session_entry (where served)"
          - name: position
            description: "Penalty position"
          - name: license_points
            description: "License points"
          - name: is_time_served_in_pit
            description: "In-pit flag"
          - name: time
            description: "Penalty time"

      # ============================================================
      # LOOKUP TABLES
      # ============================================================

      - name: v2_countries
        description: "Country code to country name mapping (renamed from _countries_lookup)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: country_code
            description: "ISO country code"
            tests:
              - unique
          - name: country
            description: "Country name"
          - name: iso_alpha3
            description: "ISO alpha-3 code"
          - name: continent
            description: "Continent"

