          - name: year
            description: "Year"
          - name: constructor_id
            description: "FK to v2_constructor"
            tests:
              - relationships:
                  to: source('main', 'v2_constructor')
                  field: id
          - name: round_id
            description: "FK to v2_round"
            tests:
              - relationships:
                  to: source('main', 'v2_round')
                  field: id
          - name: position
            description: "Standings position"
          - name: points
            description: "Championship points"
          - name: win_count
            description: "Number of wins"
          - name: highest_finish
            description: "Highest finish"
          - name: is_eligible
            description: "Eligible flag"
          - name: adjustment_type
            description: "Adjustment type"
          - name: session_id
            description: "FK to v2_session"
          - name: session_number
            description: "Session number"
          - name: round_number
            description: "Round number"

      # ============================================================
      # DETAIL TABLES
      # ============================================================

      - name: v2_lap
        description: "Per-lap data (no api_id)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: session_entry_id
