version: 2

sources:
  - name: main
    description: "Transformed F1 data (clean API for downstream consumption)"
    loader: "Python build script + migration SQL"

    tables:
      # ============================================================
      # CORE DIMENSION TABLES
      # ============================================================

      - name: season
        description: "F1 racing seasons with metadata"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: year
            description: "Season year"
            tests:
              - unique
          - name: championship_system_id
            description: "FK to championship_system"
            tests:
              - relationships:
                  to: source('main', 'championship_system')
                  field: id
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: circuit
        description: "Circuit/tracks information"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Circuit name"
          - name: reference
            description: "Circuit reference code"
          - name: locality
            description: "City/locality"
          - name: country
            description: "Country name"
          - name: country_code
            description: "ISO country code"
          - name: latitude
            description: "Latitude coordinate"
          - name: longitude
            description: "Longitude coordinate"
          - name: altitude
            description: "Altitude in meters"
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: driver
        description: "Driver master data (nationality moved to driver_season)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: reference
            description: "Driver reference code"
          - name: abbreviation
            description: "Driver abbreviation"
          - name: forename
            description: "First name"
          - name: surname
            description: "Last name"
          - name: date_of_birth
            description: "Date of birth"
          - name: permanent_car_number
            description: "Permanent race number"
          - name: birth_country
            description: "Birth country"
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: constructor
        description: "Constructor/team master data"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Constructor name"
          - name: reference
            description: "Constructor reference code"
            tests:
              - unique
          - name: constructor_base_id
            description: "FK to constructor_base for team lineage"
            tests:
              - relationships:
                  to: source('main', 'constructor_base')
                  field: id
          - name: primary_color
            description: "Primary constructor color"
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: engine
        description: "Engine/power unit manufacturers"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Engine manufacturer name"
          - name: reference
            description: "Reference code"
            tests:
              - unique
          - name: nationality
            description: "Manufacturer nationality"
          - name: founded_year
            description: "Year founded"
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: constructor_base
        description: "Base/parent constructor groupings"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Base constructor name"
          - name: api_id
            description: "Jolpica API identifier"

      - name: points_system
        description: "Points allocation rules"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Points system name"
          - name: reference
            description: "Reference code"
          - name: partial
            description: "Partial season flag"
          - name: driver_position_points
            description: "Driver position points"
          - name: driver_fastest_lap
            description: "Fastest lap bonus for drivers"
          - name: team_position_points
            description: "Team position points"
          - name: team_fastest_lap
            description: "Fastest lap bonus for teams"
          - name: shared_drive
            description: "Shared drive allowance"
          - name: is_double_points
            description: "Double points flag"
          - name: api_id
            description: "Jolpica API identifier"

      - name: championship_system
        description: "Championship calculation rules"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "System name"
          - name: reference
            description: "Reference code"
          - name: driver_best_results
            description: "Best results count for drivers"
          - name: team_best_results
            description: "Best results count for teams"
          - name: driver_season_split
            description: "Driver season split"
          - name: team_season_split
            description: "Team season split"
          - name: team_points_per_session
            description: "Team points per session flag"
          - name: eligibility
            description: "Eligibility rules"
          - name: api_id
            description: "Jolpica API identifier"

      # ============================================================
      # ATTRIBUTE HISTORY TABLES
      # ============================================================

      - name: driver_season
        description: "Driver nationality per season (temporal tracking)"
        columns:
          - name: driver_id
            description: "FK to driver"
            tests:
              - relationships:
                  to: source('main', 'driver')
                  field: id
          - name: season_id
            description: "FK to season"
            tests:
              - relationships:
                  to: source('main', 'season')
                  field: id
          - name: nationality
            description: "Nationality for that season"
          - name: country_code
            description: "ISO country code"
        unique_key:
          - driver_id
          - season_id

      - name: constructor_season
        description: "Constructor name/nationality per season (temporal tracking)"
        columns:
          - name: constructor_id
            description: "FK to constructor"
            tests:
              - relationships:
                  to: source('main', 'constructor')
                  field: id
          - name: season_id
            description: "FK to season"
            tests:
              - relationships:
                  to: source('main', 'season')
                  field: id
          - name: name
            description: "Name used that season"
          - name: nationality
            description: "Nationality for that season"
          - name: country_code
            description: "ISO country code"
          - name: constructor_base_id
            description: "Team lineage reference"
        unique_key:
          - constructor_id
          - season_id

      - name: constructor_engine
        description: "Constructor-engine relationships per season"
        columns:
          - name: constructor_id
            description: "FK to constructor"
            tests:
              - relationships:
                  to: source('main', 'constructor')
                  field: id
          - name: season_id
            description: "FK to season"
            tests:
              - relationships:
                  to: source('main', 'season')
                  field: id
          - name: engine_id
            description: "FK to engine"
            tests:
              - relationships:
                  to: source('main', 'engine')
                  field: id
          - name: engine_ref_override
            description: "Optional override for custom entries"
        unique_key:
          - constructor_id
          - season_id

      # ============================================================
      # EVENT TABLES
      # ============================================================

      - name: round
        description: "Race rounds/events"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: season_id
            description: "FK to season"
            tests:
              - relationships:
                  to: source('main', 'season')
                  field: id
          - name: circuit_id
            description: "FK to circuit"
            tests:
              - relationships:
                  to: source('main', 'circuit')
                  field: id
          - name: number
            description: "Round number"
          - name: name
            description: "Event name"
          - name: date
            description: "Event date"
          - name: is_cancelled
            description: "Cancelled flag"
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: constructor_driver
        description: "Constructor-driver assignments per season"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: season_id
            description: "FK to season"
            tests:
              - relationships:
                  to: source('main', 'season')
                  field: id
          - name: constructor_id
            description: "FK to constructor"
            tests:
              - relationships:
                  to: source('main', 'constructor')
                  field: id
          - name: driver_id
            description: "FK to driver"
            tests:
              - relationships:
                  to: source('main', 'driver')
                  field: id
          - name: role
            description: "Role type"

      - name: round_entry
        description: "Entry list per race"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: round_id
            description: "FK to round"
            tests:
              - relationships:
                  to: source('main', 'round')
                  field: id
          - name: constructor_driver_id
            description: "FK to constructor_driver"
            tests:
              - relationships:
                  to: source('main', 'constructor_driver')
                  field: id
          - name: car_number
            description: "Car number"

      - name: session
        description: "Race sessions (practice, qualifying, race, sprint)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: round_id
            description: "FK to round"
            tests:
              - relationships:
                  to: source('main', 'round')
                  field: id
          - name: type
            description: "Session type (R=Race, Q=Qualifying, P=Practice, S=Sprint)"
          - name: number
            description: "Session number"
          - name: timestamp
            description: "Session start timestamp"
          - name: timezone
            description: "Timezone"
          - name: scheduled_laps
            description: "Scheduled laps"
          - name: point_system_id
            description: "FK to points_system"
            tests:
              - relationships:
                  to: source('main', 'points_system')
                  field: id
          - name: is_cancelled
            description: "Cancelled flag"
          - name: has_time_data
            description: "Has timing data flag"

      - name: session_entry
        description: "Driver session results"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: session_id
            description: "FK to session"
            tests:
              - relationships:
                  to: source('main', 'session')
                  field: id
          - name: round_entry_id
            description: "FK to round_entry"
            tests:
              - relationships:
                  to: source('main', 'round_entry')
                  field: id
          - name: grid
            description: "Grid position"
          - name: position
            description: "Finishing position"
          - name: points
            description: "Points awarded"
          - name: laps_completed
            description: "Laps completed"
          - name: fastest_lap_rank
            description: "Fastest lap rank"
          - name: time
            description: "Finish time"
          - name: detail
            description: "Additional details"
          - name: status
            description: "Result status"
          - name: is_classified
            description: "Classified flag"
          - name: is_eligible_for_points
            description: "Points eligible flag"

      # ============================================================
      # CHAMPIONSHIP TABLES
      # ============================================================

      - name: driver_championship
        description: "Driver championship standings"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: season_id
            description: "FK to season"
            tests:
              - relationships:
                  to: source('main', 'season')
                  field: id
          - name: year
            description: "Year"
          - name: driver_id
            description: "FK to driver"
            tests:
              - relationships:
                  to: source('main', 'driver')
                  field: id
          - name: round_id
            description: "FK to round"
            tests:
              - relationships:
                  to: source('main', 'round')
                  field: id
          - name: position
            description: "Standings position"
          - name: points
            description: "Championship points"
          - name: win_count
            description: "Number of wins"
          - name: highest_finish
            description: "Highest finish"
          - name: is_eligible
            description: "Eligible flag"
          - name: adjustment_type
            description: "Adjustment type"
          - name: session_id
            description: "FK to session"
            tests:
              - relationships:
                  to: source('main', 'session')
                  field: id
          - name: session_number
            description: "Session number"
          - name: round_number
            description: "Round number"

      - name: constructor_championship
        description: "Constructor championship standings"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: season_id
            description: "FK to season"
            tests:
              - relationships:
                  to: source('main', 'season')
                  field: id
          - name: year
            description: "Year"
          - name: constructor_id
            description: "FK to constructor"
            tests:
              - relationships:
                  to: source('main', 'constructor')
                  field: id
          - name: round_id
            description: "FK to round"
            tests:
              - relationships:
                  to: source('main', 'round')
                  field: id
          - name: position
            description: "Standings position"
          - name: points
            description: "Championship points"
          - name: win_count
            description: "Number of wins"
          - name: highest_finish
            description: "Highest finish"
          - name: is_eligible
            description: "Eligible flag"
          - name: adjustment_type
            description: "Adjustment type"
          - name: session_id
            description: "FK to session"
          - name: session_number
            description: "Session number"
          - name: round_number
            description: "Round number"

      # ============================================================
      # DETAIL TABLES
      # ============================================================

      - name: lap
        description: "Per-lap data"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: session_entry_id
            description: "FK to session_entry"
            tests:
              - relationships:
                  to: source('main', 'session_entry')
                  field: id
          - name: number
            description: "Lap number"
          - name: position
            description: "Position on lap"
          - name: time
            description: "Lap time"
          - name: average_speed
            description: "Average speed"
          - name: is_fastest_lap
            description: "Fastest lap flag"
          - name: is_deleted
            description: "Deleted flag"

      - name: pit_stop
        description: "Pit stop events"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: session_entry_id
            description: "FK to session_entry"
            tests:
              - relationships:
                  to: source('main', 'session_entry')
                  field: id
          - name: lap_id
            description: "FK to lap"
            tests:
              - relationships:
                  to: source('main', 'lap')
                  field: id
          - name: number
            description: "Pit stop number"
          - name: duration
            description: "Duration"
          - name: local_timestamp
            description: "Timestamp"

      - name: penalty
        description: "Driver penalties"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: earned_session_entry_id
            description: "FK to session_entry (where earned)"
          - name: served_session_entry_id
            description: "FK to session_entry (where served)"
          - name: position
            description: "Penalty position"
          - name: license_points
            description: "License points"
          - name: is_time_served_in_pit
            description: "In-pit flag"
          - name: time
            description: "Penalty time"

      # ============================================================
      # LOOKUP TABLES
      # ============================================================

      - name: countries
        description: "Country code to country name mapping"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: country_code
            description: "ISO country code"
            tests:
              - unique
          - name: country
            description: "Country name"
          - name: iso_alpha3
            description: "ISO alpha-3 code"
          - name: continent
            description: "Continent"
