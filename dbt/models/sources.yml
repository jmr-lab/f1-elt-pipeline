# dbt/models/sources.yml
version: 2

sources:
  - name: main
    description: "SQLite database with normalized F1 data (v2 schema)"
    loader: "Python build script + migration SQL"

    tables:
      # ============================================================
      # DIMENSION TABLES
      # ============================================================

      - name: v2_season
        description: "F1 racing seasons with metadata (no api_id)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: year
            description: "Season year"
            tests:
              - unique
          - name: championship_system_id
            description: "FK to championship_system"
            tests:
              - relationships:
                  to: source('main', 'championship_system')
                  field: id
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: v2_circuit
        description: "Circuit/tracks information (no api_id)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Circuit name"
          - name: reference
            description: "Circuit reference code"
          - name: locality
            description: "City/locality"
          - name: country
            description: "Country name"
          - name: country_code
            description: "ISO country code"
          - name: latitude
            description: "Latitude coordinate"
          - name: longitude
            description: "Longitude coordinate"
          - name: altitude
            description: "Altitude in meters"
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: v2_driver
        description: "Driver master data (no api_id, nationality moved to v2_driver_season)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: reference
            description: "Driver reference code"
          - name: abbreviation
            description: "Driver abbreviation"
          - name: forename
            description: "First name"
          - name: surname
            description: "Last name"
          - name: date_of_birth
            description: "Date of birth"
          - name: permanent_car_number
            description: "Permanent race number"
          - name: birth_country
            description: "Birth country"
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: v2_constructor
        description: "Constructor/team master data (renamed from 'team', no api_id)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Constructor name"
          - name: reference
            description: "Constructor reference code"
            tests:
              - unique
          - name: base_constructor_id
            description: "FK to base_constructor for team lineage"
            tests:
              - relationships:
                  to: source('main', 'base_team')
                  field: id
          - name: primary_color
            description: "Primary constructor color"
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: v2_engine
        description: "Engine/power unit manufacturers (NEW)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Engine manufacturer name"
          - name: reference
            description: "Reference code"
            tests:
              - unique
          - name: nationality
            description: "Manufacturer nationality"
          - name: founded_year
            description: "Year founded"
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: base_team
        description: "Base/parent team groupings (unchanged)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Base team name"
          - name: api_id
            description: "Jolpiка API identifier"

      - name: points_system
        description: "Points allocation rules (unchanged)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "Points system name"
          - name: reference
            description: "Reference code"
          - name: partial
            description: "Partial season flag"
          - name: driver_position_points
            description: "Driver position points"
          - name: driver_fastest_lap
            description: "Fastest lap bonus for drivers"
          - name: team_position_points
            description: "Team position points"
          - name: team_fastest_lap
            description: "Fastest lap bonus for teams"
          - name: shared_drive
            description: "Shared drive allowance"
          - name: is_double_points
            description: "Double points flag"
          - name: api_id
            description: "Jolpiка API identifier"

      - name: championship_system
        description: "Championship calculation rules (unchanged)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            description: "System name"
          - name: reference
            description: "Reference code"
          - name: driver_best_results
            description: "Best results count for drivers"
          - name: team_best_results
            description: "Best results count for teams"
          - name: driver_season_split
            description: "Driver season split"
          - name: team_season_split
            description: "Team season split"
          - name: team_points_per_session
            description: "Team points per session flag"
          - name: eligibility
            description: "Eligibility rules"
          - name: api_id
            description: "Jolpiка API identifier"

      # ============================================================
      # ATTRIBUTE HISTORY TABLES (NEW)
      # ============================================================

      - name: v2_driver_season
        description: "Driver nationality per season (NEW for temporal tracking)"
        columns:
          - name: driver_id
            description: "FK to v2_driver"
            tests:
              - relationships:
                  to: source('main', 'v2_driver')
                  field: id
          - name: season_id
            description: "FK to v2_season"
            tests:
              - relationships:
                  to: source('main', 'v2_season')
                  field: id
          - name: nationality
            description: "Nationality for that season"
          - name: country_code
            description: "ISO country code"
        unique_key:
          - driver_id
          - season_id

      - name: v2_constructor_season
        description: "Constructor name/nationality per season (NEW for temporal tracking)"
        columns:
          - name: constructor_id
            description: "FK to v2_constructor"
            tests:
              - relationships:
                  to: source('main', 'v2_constructor')
                  field: id
          - name: season_id
            description: "FK to v2_season"
            tests:
              - relationships:
                  to: source('main', 'v2_season')
                  field: id
          - name: name
            description: "Name used that season"
          - name: nationality
            description: "Nationality for that season"
          - name: country_code
            description: "ISO country code"
          - name: base_constructor_id
            description: "Team lineage reference"
        unique_key:
          - constructor_id
          - season_id

      - name: v2_constructor_engine
        description: "Constructor-engine relationships per season (NEW)"
        columns:
          - name: constructor_id
            description: "FK to v2_constructor"
            tests:
              - relationships:
                  to: source('main', 'v2_constructor')
                  field: id
          - name: season_id
            description: "FK to v2_season"
            tests:
              - relationships:
                  to: source('main', 'v2_season')
                  field: id
          - name: engine_id
            description: "FK to v2_engine"
            tests:
              - relationships:
                  to: source('main', 'v2_engine')
                  field: id
          - name: engine_ref_override
            description: "Optional override for custom entries"
        unique_key:
          - constructor_id
          - season_id

      # ============================================================
      # EVENT TABLES
      # ============================================================

      - name: v2_round
        description: "Race rounds/events (no api_id)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: season_id
            description: "FK to v2_season"
            tests:
              - relationships:
                  to: source('main', 'v2_season')
                  field: id
          - name: circuit_id
            description: "FK to v2_circuit"
            tests:
              - relationships:
                  to: source('main', 'v2_circuit')
                  field: id
          - name: number
            description: "Round number"
          - name: name
            description: "Event name"
          - name: date
            description: "Event date"
          - name: is_cancelled
            description: "Cancelled flag"
          - name: wikipedia
            description: "Wikipedia page URL"

      - name: v2_constructor_driver
        description: "Constructor-driver assignments per season (renamed from team_driver)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: season_id
            description: "FK to v2_season"
            tests:
              - relationships:
                  to: source('main', 'v2_season')
                  field: id
          - name: constructor_id
            description: "FK to v2_constructor"
            tests:
              - relationships:
                  to: source('main', 'v2_constructor')
                  field: id
          - name: driver_id
            description: "FK to v2_driver"
            tests:
              - relationships:
                  to: source('main', 'v2_driver')
                  field: id
          - name: role
            description: "Role type"

      - name: v2_round_entry
        description: "Entry list per race (renamed from roundentry)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: round_id
            description: "FK to v2_round"
            tests:
              - relationships:
                  to: source('main', 'v2_round')
                  field: id
          - name: constructor_driver_id
            description: "FK to v2_constructor_driver"
            tests:
              - relationships:
                  to: source('main', 'v2_constructor_driver')
                  field: id
          - name: car_number
            description: "Car number"

      - name: v2_session
        description: "Race sessions (practice, qualifying, race, sprint)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: round_id
            description: "FK to v2_round"
            tests:
              - relationships:
                  to: source('main', 'v2_round')
                  field: id
          - name: type
            description: "Session type (R=Race, Q=Qualifying, P=Practice, S=Sprint)"
          - name: number
            description: "Session number"
          - name: timestamp
            description: "Session start timestamp"
          - name: timezone
            description: "Timezone"
          - name: scheduled_laps
            description: "Scheduled laps"
          - name: point_system_id
            description: "FK to points_system"
            tests:
              - relationships:
                  to: source('main', 'points_system')
                  field: id
          - name: is_cancelled
            description: "Cancelled flag"
          - name: has_time_data
            description: "Has timing data flag"

      - name: v2_session_entry
        description: "Driver session results (no api_id)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: session_id
            description: "FK to v2_session"
            tests:
              - relationships:
                  to: source('main', 'v2_session')
                  field: id
          - name: round_entry_id
            description: "FK to v2_round_entry"
            tests:
              - relationships:
                  to: source('main', 'v2_round_entry')
                  field: id
          - name: grid
            description: "Grid position"
          - name: position
            description: "Finishing position"
          - name: points
            description: "Points awarded"
          - name: laps_completed
            description: "Laps completed"
          - name: fastest_lap_rank
            description: "Fastest lap rank"
          - name: time
            description: "Finish time"
          - name: detail
            description: "Additional details"
          - name: status
            description: "Result status"
          - name: is_classified
            description: "Classified flag"
          - name: is_eligible_for_points
            description: "Points eligible flag"

      # ============================================================
      # CHAMPIONSHIP TABLES
      # ============================================================

      - name: v2_driver_championship
        description: "Driver championship standings (no api_id)"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: season_id
