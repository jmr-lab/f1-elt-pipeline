version: 2

sources:
  - name: jolpica
    description: "Raw F1 data from the Jolpica API, loaded by src/02-load.py"
    schema: jolpica
    loader: "src/02-load.py"

    tables:
      - name: season
      - name: circuit
      - name: driver
      - name: team
      - name: round
      - name: team_driver
      - name: roundentry
      - name: session
      - name: session_entry
      - name: driver_championship
      - name: team_championship
      - name: lap
      - name: pit_stop
      - name: penalty
      - name: base_team
      - name: points_system
      - name: championship_system
      - name: _countries_lookup
