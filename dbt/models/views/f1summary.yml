version: 2

models:
  - name: f1summary
    description: "Denormalised race results view joining session entries to drivers, constructors, seasons and championship points"
    meta:
      owner: "jmr-lab"
      refresh_schedule: "weekly"

    columns:
      - name: resultId
        description: "Unique session entry identifier"
        tests:
          - unique
          - not_null
      - name: grid
        description: "Starting grid position"
      - name: positionOrder
        description: "Finishing position in the race"
      - name: cumulPoints
        description: "Cumulative championship points after this race"
      - name: points
        description: "Points awarded in this race"
      - name: laps
        description: "Laps completed"
      - name: rank
        description: "Fastest lap rank"
      - name: status
        description: "Derived race finish status (Finished, Lapsed, Not Qualified, Abandoned)"
      - name: year
        description: "Season year (excludes current year)"
      - name: round
        description: "Round number within the season"
      - name: circuit
        description: "Event name"
      - name: driverName
        description: "Driver's full name"
        tests:
          - not_null
      - name: driverAge
        description: "Driver age at time of season"
      - name: constructorName
        description: "Constructor/team name"
      - name: driverCountry
        description: "Driver's nationality for that season"
      - name: constructorCountry
        description: "Constructor's nationality for that season"
      - name: driverImage
        description: "Path to driver's nationality flag icon"
      - name: constructorImage
        description: "Path to constructor's nationality flag icon"
      - name: engineId
        description: "FK to engine"
      - name: engineReference
        description: "Engine reference code"
      - name: engineName
        description: "Engine manufacturer name"
      - name: engineNationality
        description: "Engine manufacturer nationality"
